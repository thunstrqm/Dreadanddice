};
let tipSeen=(()=>{try{return JSON.parse(localStorage.getItem('dd.tips')||'[]');}catch(e){return[];}})();
const tipQ=[];
function tip(id){
  if(tipSeen.includes(id)||tipQ.includes(id))return;
  tipQ.push(id);if($('#peek').hidden)nextTip();
}
function nextTip(){
  const id=tipQ.shift();if(!id)return;
  tipSeen.push(id);try{localStorage.setItem('dd.tips',JSON.stringify(tipSeen));}catch(e){}
  const T=TIPS[id],pk=$('#peek');
  pk.innerHTML=`<button class="xbtn" id="pkX" aria-label="Close"></button><div class="pn">${T.t}</div><p class="flav">${T.b}</p><button class="btn primary" id="tipOk">Got it</button>`;
  $('#pkX').onclick=()=>{hidePeek();if(tipQ.length)setTimeout(nextTip,150);};
  pk.hidden=false;pk.dataset.tip='1';
  $('#tipOk').onclick=()=>{hidePeek();if(tipQ.length)setTimeout(nextTip,150);};
  if(G.padSeen)$('#tipOk').focus();
}

/* ================= FINALE ================= */
async function finale(){
  clearRun();
  const surv=livingH(),dead=G.partyIds.filter(id=>!surv.some(h=>h.rid===id));
  META.roster=META.roster.filter(d=>!dead.includes(d.rid));
  for(const h of surv){h.hp=h.max;h.dd=false;h.virtue=null;h.bleed=0;h.block=0;
    const i=META.roster.findIndex(d=>d.rid===h.rid);if(i>=0)META.roster[i]=heroData(h);else if(META.roster.length<rosterCap())META.roster.push(heroData(h));}
  META.gold+=G.gold;deed('goldBank',G.gold);deed('exped');META.stash.push(...(G.found||[]));
  META.beaten.bell=(META.beaten.bell||0)+1;META.won=(META.won||0)+1;META.week++;META.pool=newPool();
  META.letters=META.letters||[];if(!META.letters.includes('end'))META.letters.push('end');
  saveMeta();
  const rec=loadRec();rec.runs++;rec.wins++;saveRec(rec);
  G.busy=false;G.phase='end';
  await banner('The bell is broken','virtue',2600,'Hollowmere falls silent');
  letterScreen('end',()=>epilogueStats(surv));
}
function epilogueStats(surv){
  const D=META.deeds||{},r=loadRec(),best=META.roster.slice().sort((a,b)=>(b.lvl||1)-(a.lvl||1)||a.stress-b.stress)[0];
  showScreen(`<h2>What It Cost</h2>
   <div class="ledger stats">
    <div><span>Weeks in Hollowmere</span><span>${META.week-1}</span></div>
    <div><span>Expeditions</span><span>${D.exped||0}</span></div>
    <div><span>Heroes lost</span><span>${D.deaths||0}</span></div>
    <div><span>Gold brought up</span><span>${D.goldBank||0}</span></div>
    <div><span>Elite foes slain</span><span>${D.elites||0}</span></div>
    <div><span>Critical strikes</span><span>${D.crits||0}</span></div>
    <div><span>Callings answered</span><span>${META.unlocked.length} of ${ALLHERO.length}</span></div>
    <div><span>Journal pages found</span><span>${(META.pages||[]).length} of ${PAGES.length}</span></div>
    ${META.ngp?`<div><span>Bell</span><span>${META.ngp+1}</span></div>`:''}
   </div>
   <p class="flav">They came back from the Bell Below: ${surv.map(h=>`<em>${h.name}</em>`).join(', ')||'no one'}.${best?` The hamlet will tell stories of <em>${best.name}</em>, ${CLASSES[best.cls].name}, level ${best.lvl||1}.`:''}</p>
   <button class="btn primary" id="cred">Continue</button>`,{stage:false});
  $('#cred').onclick=credits;
}
function credits(){
  const fallen=loadRec().fallen.slice(0,12);
  showScreen(`<div class="credits">
    <h1>Dread &amp; Dice</h1>
    <p class="tag">Design and direction</p><p class="flav">You</p>
    <p class="tag">Built with</p><p class="flav">Claude</p>
    <p class="tag">With a debt to</p><p class="flav">the dice of Slice &amp; Dice and the dread of Darkest Dungeon</p>
    ${fallen.length?`<p class="tag">In memory of</p><p class="flav">${fallen.map(f=>f.n).join(' · ')}</p>`:''}
   </div>
   <div class="stack">
    <button class="btn primary" id="ngp">Ring the Second Bell<small>New Game+ · keep every calling, start a new hamlet, harder dark</small></button>
    <button class="btn" id="stay">Stay in Hollowmere<small>Keep playing this campaign</small></button>
   </div>`,{stage:false,fill:true});
  sfx.win();
  $('#ngp').onclick=()=>{newCampaign(true);goHamlet();};
  $('#stay').onclick=goHamlet;
}

/* ================= LAYOUT: fit everything to the screen ================= */
function layout(){
  const app=$('#app'),H=app.clientHeight,W=app.clientWidth,hud=$('#hud').offsetHeight,gap=6,B=6;
  const stage=$('#stage'),tf=$('#trayFrame');
  if(!$('#combat').hidden){
    const panelMin=Math.max(118,Math.min(150,H*.2));
    const avail=H-hud-gap*3-panelMin-B*2;
    const w=Math.floor(Math.min(W,avail/((SH+TH)/SW)+B));
    stage.style.width=w+'px';tf.style.width=w+'px';
  }else if(!stage.hidden){
    const maxH=Math.max(90,H*.24);
    stage.style.width=Math.floor(Math.min(W,maxH*SW/SH+B))+'px';
  }
}
addEventListener('resize',layout);
if(window.visualViewport)visualViewport.addEventListener('resize',layout);
