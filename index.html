<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<body>
<title>Dread & Dice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=VT323&display=swap">
<style>
/* Layout: one narrow column — stone stage on top, dice tray + ledger panel or story screen below */
:root{
  --bg:#0b0908; --panel:#140f0d; --panel2:#1d1613; --ink:#dccfb4; --muted:#8f8069;
  --blood:#a8261f; --blood-d:#5a100c; --gold:#cfa548; --line:#3d2b22; --steel:#9fb6c8; --calm:#b38be0;
  --disp:'Pirata One','UnifrakturMaguntia',Georgia,serif;
  --body:'VT323','Courier New',ui-monospace,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;box-sizing:border-box;overflow:hidden;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:20px;line-height:1.15;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  background-image:radial-gradient(ellipse at 50% 0%,#1b1210 0%,var(--bg) 60%)}
#app{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:6px;min-height:0}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
p{margin:0}
#hud{flex:none;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 6px;min-height:30px}
#hud .res{flex-wrap:wrap;justify-content:flex-end}
.torch{display:flex;align-items:center;gap:6px;min-width:0;flex:none}
#torchBar{display:flex;gap:1px;flex:none}
#torchBar i{width:4px;height:11px;background:#231a15;border:1px solid #000;display:block}
#torchBar i.on{background:linear-gradient(#ffcf6a,#d4721c);box-shadow:0 0 6px #d4721c88}
#lightLbl{font-size:15px;color:var(--gold);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.res{display:flex;align-items:center;gap:3px;font-size:17px;margin-left:auto;min-width:0;font-variant-numeric:tabular-nums}
.res span{display:inline-flex;align-items:center;gap:0}
#itemsV{display:flex;gap:3px}
#mute{flex:none}
.pxi{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle}
.icon-btn{background:none;border:2px solid var(--line);color:var(--muted);font-family:var(--body);font-size:18px;padding:0 6px;min-height:30px;min-width:30px;cursor:pointer}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
.frame{box-sizing:border-box;flex:none;align-self:center;width:100%;position:relative;border:3px solid #000;box-shadow:0 0 0 2px var(--line),0 0 0 5px #000,0 8px 30px #000a}
#narr.hero{font-family:var(--body);font-size:clamp(16px,4.4vw,20px);color:#e8c8a0}
#narr{position:absolute;left:6px;right:6px;top:6px;text-align:center;font-family:var(--disp);font-size:clamp(15px,4.2vw,20px);
  color:#eadcbd;text-shadow:0 0 4px #000,0 2px 0 #000,0 0 12px #000;opacity:0;transition:opacity .6s;pointer-events:none;text-wrap:balance}
#narr.show{opacity:1}
#banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s}
#banner.show{opacity:1}
#banner .b1{font-family:var(--disp);font-size:clamp(28px,9vw,46px);line-height:1;text-align:center;padding:4px 14px;
  text-shadow:0 3px 0 #000,0 0 10px #000,2px 2px 0 #000,-2px -2px 0 #000}
#banner .b2{font-size:20px;color:var(--ink);text-shadow:0 2px 0 #000,0 0 8px #000;text-align:center;max-width:90%;margin-top:4px}
#banner.aff .b1{color:#d24a3c}
#banner.virtue .b1{color:#f0c85a}
#banner.test .b1{color:#d8ccb4;font-size:clamp(20px,6vw,30px)}
#banner.big .b1{color:#e9dcbc}
#banner.dd .b1{color:#ff5a46}
#banner::before{content:"";position:absolute;left:0;right:0;top:32%;bottom:32%;background:linear-gradient(90deg,transparent,#000c 15%,#000c 85%,transparent);z-index:-1}
#banner{z-index:1}
#lower{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#panel{flex:1;min-height:0;overflow:auto;background:var(--panel);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line);padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
#hint{color:var(--ink);font-size:19px;line-height:1.1}
#hint b{color:var(--gold);font-weight:400}
#hint .warn{color:#d0574b}
#acts{display:flex;gap:8px;flex-wrap:wrap}
#acts .btn{flex:1 1 140px}
.btn{font-family:var(--body);font-size:20px;color:var(--ink);background:linear-gradient(#2c211b,#1a1310);border:2px solid #000;
  box-shadow:inset 0 0 0 1px #4a3529,inset 0 2px 0 #5d4433;padding:4px 10px;cursor:pointer;min-height:42px;text-align:center}
.btn:hover{filter:brightness(1.15)}
.btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.warnbtn{background:linear-gradient(#5a3a12,#331f08);box-shadow:inset 0 0 0 1px #c08a2a,inset 0 2px 0 #d8a040;color:#f3e4c4}
.btn.primary{background:linear-gradient(#6c1813,#3d0b08);box-shadow:inset 0 0 0 1px #a3342a,inset 0 2px 0 #bb4a3c;color:#f3e4c4}
.btn:disabled{opacity:.38;cursor:default;filter:none}
.btn .k{font-size:16px;color:var(--gold);margin-left:6px}
.btn small{display:block;font-size:16px;color:var(--muted);line-height:1.05;margin-top:2px}
#combat{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
#peek{position:absolute;left:0;right:0;top:0;bottom:0;overflow-y:auto;overscroll-behavior:contain;z-index:5;background:#0b0807f2;border:2px solid #000;box-shadow:inset 0 0 0 1px var(--gold),0 10px 30px #000;
  padding:8px 10px;display:flex;flex-direction:column;gap:6px}
#peek .ph{display:flex;gap:12px;align-items:center}
#peek canvas.net{width:auto;height:96px;flex:0 0 auto}
#peek .pn{font-family:var(--disp);font-size:26px;color:#e8d9b8;line-height:1}
#peek .pc{color:var(--muted);font-size:18px}
#peek ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
#peek li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;font-size:17px;line-height:1.02;color:var(--muted)}
#peek li b{color:var(--ink);font-weight:400}
#peek li.cur b{color:var(--gold)}
#peek li img{width:26px;height:26px}
#peek .kw{color:var(--muted);font-size:17px;border-top:1px solid var(--line);padding-top:6px}
#peek .kw b{color:var(--ink);font-weight:400}
canvas#scene,canvas#tray{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#detail{font-size:19px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
#detail:empty{display:none}
#detail .nm{color:var(--ink);font-size:21px}
.faces{display:flex;gap:4px;flex-wrap:wrap}
.faces img{width:30px;height:30px}
#screen{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
#screen h1{font-size:clamp(42px,12vw,64px);line-height:.9;color:#e8d9b8;text-shadow:0 4px 0 #000,0 0 18px #6a0f0a}
#screen h2{font-size:26px;color:#e8d9b8;line-height:1}
#screen h3{font-size:22px;color:var(--gold)}
.tag{color:var(--muted);font-size:20px}
.flav{color:var(--ink);font-size:19px;line-height:1.1;max-width:62ch}
.flav em{color:var(--gold);font-style:normal}
.stack{display:flex;flex-direction:column;gap:6px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn.sm{min-height:34px;font-size:18px;padding:2px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{background:var(--panel2);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line);padding:5px 6px;display:grid;grid-template-columns:34px 1fr;gap:1px 6px;align-items:center;
  text-align:left;color:var(--ink);font-family:var(--body);font-size:18px;cursor:pointer;min-width:0}
.card.sel{box-shadow:inset 0 0 0 2px var(--gold),0 0 12px #cfa54844}
.card .cn{font-family:var(--disp);font-size:20px;color:#e8d9b8;line-height:1}
.card .cb{display:flex;flex-direction:column;gap:2px;min-width:0}
.card .faces img{width:15px;height:15px}
.card .faces{gap:1px;flex-wrap:nowrap}
.card .cs{color:var(--muted)}
.card .ord{color:var(--gold);font-size:20px}
.card img.spr{width:33px;height:48px}
.party{display:flex;flex-direction:column;gap:4px}
.prow{display:grid;grid-template-columns:28px 1fr auto;gap:6px;padding:2px 6px !important;align-items:center;background:var(--panel2);border:1px solid #000;box-shadow:inset 0 0 0 1px var(--line);padding:4px 6px}
.prow > img{width:28px;height:28px;object-fit:cover;object-position:top}
.prow .info{min-width:0;font-size:16px;line-height:1}
.prow .info .n{color:var(--ink);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .info .s{color:var(--muted)}
.chip{display:inline-block;font-size:14px;padding:0 4px;border:1px solid currentColor;margin-right:3px;line-height:1.2}
.chip.dd{color:#ff5a46}.chip.aff{color:#d0574b}.chip.vir{color:var(--gold)}
.prow .ctl{display:flex;gap:3px}
.prow .ctl .btn{min-height:32px;min-width:32px;padding:0 4px;font-size:16px;flex:0 0 auto;display:grid;place-items:center}
.prow .ctl .btn img{width:18px;height:18px}

.track{display:flex;gap:3px;flex-wrap:wrap}
.track i{width:16px;height:10px;background:#231a15;border:1px solid #000;display:block}
.track i.done{background:#5a4232}
.track i.here{background:var(--gold)}
.track i.boss{background:var(--blood)}
.track i.t-battle{background:#7a2a22}.track i.t-elite{background:#b0281e}.track i.t-curio{background:#5d3f86}.track i.t-camp{background:#c76a12}.track i.t-trader{background:#2e6a66}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px}
.door{min-height:58px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;text-align:left;
  background:linear-gradient(#0a0706 0%,#0a0706 35%,#211813 100%);border:2px solid #000;box-shadow:inset 0 0 0 2px #3a2a20,inset 0 -20px 30px #0008;
  color:var(--ink);font-family:var(--body);font-size:20px;padding:6px 8px;cursor:pointer;border-radius:40px 40px 0 0}
.door .dt{font-family:var(--disp);font-size:20px;color:#e8d9b8;line-height:1}
.door .dh{color:var(--muted);font-size:15px;line-height:1}
.doors .door .dh{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doors .door{min-height:50px}
.track{flex-wrap:nowrap}
.track i{width:9px}
.hrow .tag{white-space:nowrap}
.door.unknown .dt{color:var(--muted)}
.door:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.door.zone{min-height:0;border-radius:40px 40px 0 0;padding:8px 14px}
.door.zone .dh{font-size:15px}
.lv{color:var(--gold);font-size:16px}
.prow .qs{line-height:1.1}
.prow .qs:empty{display:none}
.prow.wide{grid-template-columns:28px 1fr}
.prow.wide .ctl{grid-column:1 / -1;flex-wrap:wrap}
.prow.wide .ctl .btn{min-width:0;padding:0 8px}
.prow .ctl .btn:not(:has(img)){padding:0 8px}
.lvopt{text-align:left;display:flex;flex-direction:column;gap:4px}
.lvopt .lvn{font-family:var(--disp);font-size:20px;color:#e8d9b8}
.lvopt .faces img{width:26px;height:26px;outline:1px solid transparent}
.lvopt .faces img.chg{outline:2px solid var(--gold);outline-offset:1px}
.hone .faces{justify-content:center;align-items:center;gap:6px}
.hone .faces img{width:26px;height:26px}
.menu .btn{min-height:52px}
.rk{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;margin-left:2px;white-space:nowrap}
.rk-g{display:inline-flex;gap:2px}
.rk-g i{width:7px;height:7px;background:#2a211c;border:1px solid #000;display:block}
.rk-g i.f{background:#f0c85a}
.rk-g i.t{background:#d0402e}
.rk-g i.tv{background:#d0402e;opacity:.55}
.rk .ar{color:var(--muted);font-size:14px;line-height:1}
.rk-x{color:var(--muted);font-size:14px}
#hint .rk{margin-left:4px}
#acts .spells{flex:1 1 100%;display:flex;gap:4px;align-items:stretch;flex-wrap:wrap}
#acts .spells .mana{color:#7aa0ff;font-size:20px;align-self:center;min-width:34px}
#acts .btn.spell{flex:1 1 70px;min-height:38px;font-size:16px;padding:2px 4px;line-height:1;background:linear-gradient(#1c2340,#10142a);box-shadow:inset 0 0 0 1px #3a5ab0}
#acts .btn.spell small{font-size:14px;color:#7aa0ff}
#acts #bUndo{flex:0 1 90px}
.gearlist{display:flex;flex-direction:column;gap:4px}
.grow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--panel2);border:1px solid #000;box-shadow:inset 0 0 0 1px var(--line);padding:5px 8px}
.grow.eq{box-shadow:inset 0 0 0 1px var(--gold)}
.grow.empty{opacity:.6}
.grow .gi{min-width:0;display:flex;flex-direction:column;line-height:1.05}
.grow .gi b{font-weight:400;color:var(--ink);font-size:18px}
.grow .gi span{color:var(--muted);font-size:16px}
.grow .btn{min-height:36px;font-size:17px;padding:2px 8px;max-width:130px}
.rar{font-size:13px;padding:0 3px;border:1px solid currentColor;margin-left:4px;vertical-align:middle}
.rar.o{color:#c28cf0}.rar.c{color:var(--muted)}.rar.r{color:#6aa8e0}.rar.k{color:var(--gold)}
.xbtn{position:absolute;top:6px;right:6px;z-index:2;width:34px;height:34px;padding:0;display:grid;place-items:center;
  background:linear-gradient(#2c211b,#1a1310);border:2px solid #000;box-shadow:inset 0 0 0 1px #4a3529;cursor:pointer}
.xbtn::before,.xbtn::after{content:"";position:absolute;width:16px;height:3px;background:var(--ink);transform:rotate(45deg)}
.xbtn::after{transform:rotate(-45deg)}
.xbtn:hover{filter:brightness(1.2)}
.xbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hrow .xbtn{position:static;flex:none;position:relative}
#screen.hasx > h2:first-child,#screen.hasx > .hrow:first-child{padding-right:42px}
#peek .ph,#peek > .pn:first-child{padding-right:40px}
.letter{display:flex;flex-direction:column;gap:8px;background:#e6dcc4;color:#2a1d16;padding:12px 14px;border:2px solid #000;box-shadow:inset 0 0 0 1px #8a7a5a,0 6px 18px #000a;
  background-image:radial-gradient(ellipse at 20% 10%,#f2ead6 0,#e0d3b6 70%,#cdbd98 100%)}
.letter h2{color:#4a140f !important;font-size:24px !important}
.letter .flav{color:#2a1d16;font-size:18px}
.letter .sig{font-family:var(--disp);color:#4a140f;font-size:20px;text-align:right;margin:0}
.jr details{background:var(--panel2);border:1px solid #000;box-shadow:inset 0 0 0 1px var(--line);padding:6px 8px}
.jr summary{cursor:pointer;color:var(--ink);font-family:var(--disp);font-size:19px}
.jr details .flav{margin-top:6px}
.credits{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.credits .tag{margin-top:8px;text-transform:uppercase;letter-spacing:.1em;font-size:15px}
.stats span:last-child{color:var(--gold)}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tile{aspect-ratio:2/3;max-width:100%;background:var(--panel2);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;padding:3px;cursor:pointer}
.tile img{width:100%;height:auto}
.tile.lock{background:#0f0b0a}
.tile.sel{box-shadow:inset 0 0 0 2px var(--gold)}
.tile:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.result .faces{margin-top:4px}
.result .faces img{width:24px;height:24px}
.result{border-left:3px solid var(--blood);padding:6px 10px;background:#0f0b0a;color:var(--ink)}
.ledger{display:flex;flex-direction:column;gap:2px;font-size:18px;flex:1;min-height:0;overflow:auto}
.ledger div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #2a1f19;padding:2px 0}
.ledger span:last-child{color:var(--muted);text-align:right}
ul.how{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px;max-width:62ch;font-size:17px;line-height:1.05}
.title-art{display:flex;justify-content:center;gap:4px;align-items:flex-end}
.title-art img{width:44px;height:64px}
#screen.fill{justify-content:space-between}
@media (prefers-reduced-motion:reduce){#narr,#banner{transition:none}}
</style>

<div id="app">
  <header id="hud">
    <div class="torch"><span id="lightLbl">Radiant</span><div id="torchBar" aria-label="Torch"></div></div>
    <div class="res"><span id="goldV"></span><span id="itemsV"></span><button id="mute" class="icon-btn" aria-label="Toggle sound">♪</button></div>
  </header>
  <div id="stage" class="frame">
    <canvas id="scene" width="176" height="104"></canvas>
    <div id="narr"></div>
    <div id="banner"><div class="b1"></div><div class="b2"></div></div>
  </div>
  <div id="lower">
    <div id="peek" hidden></div>
    <div id="combat" hidden>
      <div class="frame" id="trayFrame"><canvas id="tray" width="176" height="84"></canvas></div>
      <div id="panel"><div id="hint"></div><div id="acts"></div></div>
    </div>
    <div id="screen"></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const rnd=Math.random, ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)), rf=(a,b)=>a+rnd()*(b-a);
const pick=a=>a[Math.floor(rnd()*a.length)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SW=176,SH=104,TW=176,TH=84,FLOOR=92;

/* ================= PALETTE & SPRITES ================= */
const PAL={k:'#0a0706',s:'#c4a07c',S:'#86644a',b:'#d9d0b6',B:'#948a74',m:'#9a9c9e',M:'#55585d',r:'#9b1f1c',R:'#561010',
 c:'#5c4632',C:'#352819',g:'#6d7a40',G:'#3d4622',p:'#4d3356',P:'#2b1b31',w:'#e6dfcb',W:'#a59f8c',y:'#c49b3c',Y:'#7d5f1e',

function makeSprite(w,h,fn,flip){

let AC=null,master=null,muted=false,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1;
    startDrone();}catch(e){AC=null;}
}
function startDrone(){
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=170;const g=AC.createGain();g.gain.value=.045;f.connect(g);g.connect(master);
  [55,55.6,82.4].forEach(fr=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.connect(f);o.start();});
  const l=AC.createOscillator();l.frequency.value=.07;const lg=AC.createGain();lg.gain.value=60;l.connect(lg);lg.connect(f.frequency);l.start();
  setInterval(()=>{if(!muted&&rnd()<.5)noise(4000+rnd()*3000,20,.02,.04,'bandpass',.2+rnd());},2600);
}
function noise(f,q,dur,vol,type='bandpass',delay=0){if(!AC||muted)return;const t=AC.currentTime+delay;const s=AC.createBufferSource();s.buffer=noiseBuf;
  const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(master);s.start(t,rnd()*.3);s.stop(t+dur+.05);}
function tone(f,dur,vol,type='sine',to,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay;const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}

function genPath(h,type){
  const off=type==='O',fs=h.faces.map(cloneF),ch=[],notes=[];
  const bump=f=>{f.v+=bumpAmt(f);};
  const types=off?['dmg','bleed']:['blk','heal','calm','torch','loot'];
  const bi=fs.findIndex(f=>f.t==='blank');
  if(bi>=0&&rnd()<.65){const b=BOONS[h.cls][off?0:1];notes.push(`Blank → ${faceText(b)}`);fs[bi]=cloneF(b);ch.push(bi);}
  for(const i of shuffle(fs.map((f,i)=>i).filter(i=>types.includes(fs[i].t)&&!ch.includes(i)))){if(ch.length>=2)break;const b=faceText(fs[i]);bump(fs[i]);notes.push(`${b} → ${faceText(fs[i])}`);ch.push(i);}
  if(off&&h.lvl>=3){const i=fs.findIndex((f,j)=>f.t==='dmg'&&!f.k.includes('C')&&!ch.includes(j));if(i>=0){const b=faceText(fs[i]);fs[i].k.push('C');notes.push(`${b} → ${faceText(fs[i])}`);ch.push(i);}}
  if(!off&&ch.length<2){const i=fs.findIndex((f,j)=>!ch.includes(j)&&(f.t==='dmg'||f.t==='bleed'));if(i>=0){const b=faceText(fs[i]);fs[i]=F('blk',Math.max(2,fs[i].v));notes.push(`${b} → ${faceText(fs[i])}`);ch.push(i);}}
  for(const i of shuffle(fs.map((f,i)=>i))){if(ch.length>=2)break;if(ch.includes(i)||['blank','stun','mark'].includes(fs[i].t))continue;const b=faceText(fs[i]);bump(fs[i]);notes.push(`${b} → ${faceText(fs[i])}`);ch.push(i);}
  return{name:PATHS[h.cls][off?0:1],type,faces:fs,ch,notes};
}

function addStress(h,n){
  if(!h||h.dead||!n)return;
  if(n>0){if(h.virtue)n=Math.ceil(n*.6);if(hasT('locket'))n=Math.ceil(n*.8);if(qd(h,'steady'))n=Math.ceil(n*.8);const gs=gear(h).stress;if(gs)n=Math.max(1,Math.round(n*(1+gs)));}
  const before=h.stress;h.stress=clamp(h.stress+n,0,200);
  const d=h.stress-before;if(!d)return;
  floatAt(h,(d>0?'+':'-')+Math.abs(d),d>0?'#c28cf0':'#e6dfcb');
  if(d>0&&h.isHero)sfx.stress();
  if(h.isHero&&h.stress>=40)tip('stress');
  if(h.isHero&&before<70&&h.stress>=70&&h.stress<100)say('stress',1,.6);
  if(before<100&&h.stress>=100&&!h.aff&&!h.virtue)G.pendingResolve.push({h,type:'test'});
  if(before<200&&h.stress>=200)G.pendingResolve.push({h,type:'heart'});
}
async function processResolves(){
  if(G.pendingResolve.length)G.undo=[];
  while(G.pendingResolve.length){
    const r=G.pendingResolve.shift(),h=r.h;if(h.dead)continue;
    if(r.type==='dd'){tip('dd');sfx.death();await banner("Death's Door",'dd',1300,h.name);say('dd',2);continue;}
    if(r.type==='test'){
      if(h.aff||h.virtue)continue;
      tip('test');await banner(`${h.name}'s resolve is tested`,'test',1500);
      if(rnd()<.25){const v=pick(VIRTUES);h.virtue=v.id;h.stress=45;sfx.virtue();await banner(v.name,'virtue',1700,v.desc);say('virtue',2);}
      else{const a=pick(AFFS);h.aff=a.id;deed('afflicted');sfx.bell();shake(3);await banner(a.name,'aff',1700,`${h.name}: ${a.desc}`);say('aff',2);
        livingH().filter(x=>x!==h).forEach(x=>addStress(x,4));}
    } else {
      sfx.death();shake(5);await banner('Heart Attack','aff',1500,h.name);
      if(h.dd)killHero(h,'Heart gave out');else{h.hp=0;h.dd=true;h.stress=150;say('dd',2);}
    }
  }
}
function healHero(h,n){
  if(h.dead)return;
  if(h.aff==='paranoid')n=Math.floor(n/2);
  if(qd(h,'cough'))n-=1;
  n+=gear(h).healIn;
  if(n<=0){floatAt(h,'REFUSED','#d0574b');return;}
  if(h.blight){h.blight=0;floatAt(h,'CURED','#8cff6a');}
  if(h.dd){h.dd=false;h.hp=0;floatAt(h,'SAVED','#f0c85a',2);deed('ddSurv');ring(h,'#f0c85a','burst');}
  const b=h.hp;h.hp=Math.min(h.max,h.hp+n);floatAt(h,'+'+(h.hp-b),'#6ad07a',n>=5?2:1);sparkle(h,pick(['#6ad07a','#f0e0a0']),12);
}
function hurtHero(h,n,cause,pierce){
  if(h.dead||n<=0)return;
  if(!pierce&&h.block>0){const b=Math.min(h.block,n);h.block-=b;n-=b;floatAt(h,'-'+b,'#9fb6c8');sfx.block();if(n<=0)return;}
  h.flashT=.18;gore(h,8,'#9b1f1c');buzz(30);G.redFlash=Math.max(G.redFlash,.22);knock(h,-1,4);hitstop(70);
  if(h.dd){
    const resist=.62-(G.torch<25?.15:0);
    if(gear(h).ferry&&!h.ferryUsed){h.ferryUsed=true;floatAt(h,'FERRYMAN','#f0c85a');addStress(h,5);}
    else if(rnd()<resist){floatAt(h,'RESIST','#f0c85a');addStress(h,5);}
    else killHero(h,cause||'Struck down');
    return;
  }
  h.hp-=n;floatAt(h,'-'+n,'#ff4a36',n>=5?2:1);if(h.hp>0&&h.hp<=h.max*.3&&rnd()<.4)narrate(`${h.name}: “${pick(LINES.hurt)}”`);if(qd(h,'jittery'))addStress(h,3);
  if(h.hp<=0){h.hp=0;h.dd=true;addStress(h,12);G.pendingResolve.unshift({h,type:'dd'});}
}

function throwDice(fromHand){
  let any=false;
  for(const d of G.dice){
    if(d.locked||d.used||d.h.dead)continue;any=true;
    d.settled=false;d.fresh=true;
    if(fromHand){d.x=88+rf(-50,50);d.y=TH+4;d.vx=rf(-60,60);d.vy=-rf(115,170);d.z=8;}
    else{d.vx=rf(-80,80);d.vy=rf(-60,40);d.z=2;}

  }

function otherFace(d,cur,avoid){const E=efOf(d.h),fs=E.filter(f=>f!==cur&&f!==avoid);return pick(fs.length?fs:E);}
const efOf=h=>h.ef||(h.ef=facesOf(h));
function drawCube(x,d,img){

function updateDice(dt){

function faceText(f){

  const k=[];if(isAtk(f)&&!f.k.includes('K')&&!f.k.includes('H'))k.push(f.k.includes('R')?'ranged':'melee');if(f.k.includes('C'))k.push('cleave');if(f.k.includes('A'))k.push('whole party');if(f.k.includes('F'))k.push('lunge');if(f.k.includes('P'))k.push('pierce');if(f.k.includes('X'))k.push('unstable');if(f.k.includes('S'))k.push('costs 1 HP');if(f.k.includes('W'))k.push('wild');if(f.k.includes('K'))k.push('from the back');if(f.k.includes('H'))k.push('hits the back');if(f.k.includes('N'))k.push('cantrip');if(f.k.includes('G'))k.push('growth');if(f.k.includes('U'))k.push('single-use');if(f.k.includes('E'))k.push('engage');
  const v=(f.t==='stun'||f.t==='mark')?'':f.t==='torch'||f.t==='loot'?' +'+f.v:' '+f.v;
  return `${FNAME[f.t]}${v}${k.length?' · '+k.join(', '):''}`;
}
function faceHelp(f){
  return ({dmg:'Deal damage. Guard absorbs it first.',blk:'Give an ally Guard until your next turn.',heal:'Restore HP. Pulls a hero back from Death\'s Door.',
    calm:'Remove stress.',blight:'The foe takes this much damage every turn. Blight never fades.',mana:'Adds mana to the party pool. Spend mana on spells.',mark:'Marks a foe for 2 turns. Every strike against it deals 2 more.',loot:'Scavenges this much gold from the dark.',bleed:'The foe bleeds this much, then 1 less each turn.',stun:'Cancel that foe\'s intent this turn.',torch:'Raise the torch.',blank:'Nothing.'})[f.t];
}
function eFaceText(it){
  const f=it.f,tn=it.tgts&&it.tgts.length?(f.tg==='all'?'the party':it.tgts.map(t=>t.name).join(', ')):'';
  const extra=(f.shove?', shoves them back':'')+(f.mv?(f.mv<0?', then advances':', then falls back'):'');
  return ({blight:`Blight ${f.v} → ${tn}`,dmg:`Strike ${f.v} → ${tn}`,str:`Terrify ${f.v} → ${tn}`,bleed:`Rend, Bleed ${f.v} → ${tn}`,heal:`Mend ${f.v} an ally`,blk:`Brace for ${f.v}`,
    summon:'Calls for help',toll:`Toll the bell (torch −${f.v})`,shove:`Shove ${tn} to the back`,blank:'Hesitates'})[f.t]+extra;
}

/* ================= TURN FLOW ================= */
function pickTargets(f){
  const L=livingH();if(!L.length)return[];
  switch(f.tg){case 'front':return[L[0]];case 'back':return[L[L.length-1]];case 'rand':return[pick(L)];
    case 'weak':return[L.slice().sort((a,b)=>(a.dd?-1:0)-(b.dd?-1:0)||a.hp-b.hp)[0]];case 'all':return L.slice();default:return[];}
}
function enemiesRoll(){
  for(const e of activeE()){
    e.block=0;e.intents=[];const n=e.rolls||1;
    for(let i=0;i<n;i++){const f=pick(e.faces);if(f.shove||f.mv||f.t==='shove')setTimeout(()=>tip('move'),900);const it={f,tgts:pickTargets(f)};if(f.t==='blk'){e.block+=f.v;}e.intents.push(it);}
  }
}
function stepHero(h,dir){
  const L=livingH(),i=L.indexOf(h),j=i+dir;if(i<0||j<0||j>=L.length)return false;
  const a=G.heroes.indexOf(h),b=G.heroes.indexOf(L[j]);[G.heroes[a],G.heroes[b]]=[G.heroes[b],G.heroes[a]];return true;
}
function stepEnemy(e,dir){
  const L=livingE(),i=L.indexOf(e),j=i+dir;if(i<0||j<0||j>=L.length)return false;
  const a=G.enemies.indexOf(e),b=G.enemies.indexOf(L[j]);[G.enemies[a],G.enemies[b]]=[G.enemies[b],G.enemies[a]];return true;
}
const eBonus=()=>(G.torch<25?1:0)+Math.floor(G.room/5)+((ZONES[G.zone]||ZONES.crypt).tier-1)+(tideLvl()>=6?1:0)+((META&&META.ngp)||0);
function useStep(d,dir){
  if(G.busy||G.phase!=='act'||d.used)return;
  pushUndo();if(!stepHero(d.h,dir)){G.undo.pop();sfx.ui();return;}
  d.used=true;G.endArmed=false;G.sel=null;G.cur.mode='dice';sfx.toss();floatAt(d.h,dir<0?'FORWARD':'BACK','#e6dfcb');updatePanel();
}
function newTurn(){
  G.turn++;G.sel=null;G.endArmed=false;
  for(const h of livingH()){h.block=0;if(h.virtue==='stalwart')h.block+=2;const g=gear(h);h.block+=g.guard+((h.arm||0)>=4?1:0)+(G.turn===1?g.guard1:0);}
  if(hasT('ward')&&livingH()[0])livingH()[0].block+=2;
  enemiesRoll();
  if(G.firstStun&&G.turn===1){activeE().forEach(e=>e.stun=true);G.firstStun=false;}
  if(G.turn===1&&G.fb&&G.fb.guard)livingH().forEach(h=>h.block+=G.fb.guard);
  G.dice=livingH().map((h,i)=>newDie(h,i));
  G.rerolls=2+(hasT('rope')?1:0);
  G.phase='rolling';G.busy=false;G.cur={mode:'dice',i:G.dice.length-1,ti:0};
  throwDice(true);
  updatePanel();
}
async function useDie(d,t){
  const h=d.h,f=d.face;if(G.busy)return;pushUndo();G.busy=true;d.used=true;G.endArmed=false;G.sel=null;G.cur.mode='dice';updatePanel();
  if(isAtk(f)){
    camOn(h,t);
    if(f.k.includes('R')){sfx.whoosh();await proj(h,t,f.t==='blight'?'orb':f.t==='bleed'?'knife':f.t==='stun'||f.t==='mark'?'orb':'bolt',f.t==='blight'?'#8cff6a':f.t==='stun'?'#f0c85a':f.t==='mark'?'#ff5a46':'#e6dfcb',.22);}
    else{lunge(h,1);await sleep(140);slash(t);sfx.slash();}
    let tg=[t];if(f.k.includes('C')){const L=livingE(),i=L.indexOf(t);tg=[L[i-1],t,L[i+1]].filter(Boolean);}
    if(f.t==='dmg'){
      const R=f.k.includes('R');
      let v=f.v+(h.cls==='thornmonk'?Math.floor((1-h.hp/h.max)*4):0)+(h.aff==='hopeless'?-1:0)+(h.virtue==='focused'?1:0)+(hasT('knuckle')&&!R?1:0)
        +(qd(h,'eagle')&&R?1:0)+(qd(h,'brawler')&&!R?1:0)-(qd(h,'clumsy')&&!R?1:0)-(qd(h,'nightblind')&&G.torch<50?1:0)+gearDmg(h,R)+(G.buffDmg||0)+((G.fb&&G.fb.dmg)||0);v=Math.max(0,v);
      const cc0=.06+(hasT('mirror')?.12:0)+(G.torch>=75?.05:0)+(qd(h,'lucky')?.1:0)+gear(h).crit+.02*(h.wpn||0),cc=cc0;
      if(v>0&&(d.cr!=null?d.cr:rnd())<cc){deed('crits');v=Math.ceil(v*1.5)+1;sfx.crit();shake(6);buzz(70);floatAt(t,'CRIT!','#ffd36a',2);hitstop(160);G.whiteFlash=.35;punch(1.4);slash(t,'#ffd36a');say('heroCrit',1);livingH().forEach(x=>addStress(x,-3));}
      else{sfx.hit();shake(2);}
      tg.forEach(e=>dmgEnemy(e,(f.k.includes('E')&&e.hp>=e.max&&!e.corpse?v*2:v)+(e.marked?2:0),f.k.includes('P')));
    }else if(f.t==='bleed'){tg.forEach(e=>{e.bleed+=f.v+gear(h).bleed;floatAt(e,'BLEED','#ff5a46');gore(e,10,'#c0201a');});sfx.bleed();}
    else if(f.t==='blight'){tg.forEach(e=>{e.blight=(e.blight||0)+f.v+gear(h).bleed;floatAt(e,'BLIGHT','#8cff6a');sparkle(e,'#8cff6a',10);});sfx.bleed();}
    else if(f.t==='mark'){tg.forEach(e=>{e.marked=2;floatAt(e,'MARKED','#ff5a46');ring(e,'#ff5a46','cross');});sfx.stun();}
    else{tg.forEach(e=>{e.stun=true;floatAt(e,'STUN','#f0c85a',1);ring(e,'#f0c85a','burst');});sfx.stun();shake(3);hitstop(60);}
    await sleep(420);camReset();
    if(f.k.includes('F')&&!h.dead&&stepHero(h,-1))floatAt(h,'LUNGE','#e6dfcb');
  }else{
    const tg=f.k.includes('A')?livingH():[t];
    if(f.t==='blk'){tg.forEach(x=>{x.block+=f.v;floatAt(x,'+'+f.v,'#9fb6c8');ring(x,'#9fb6c8','shield');});sfx.block();}
    else if(f.t==='heal'){tg.forEach(x=>{const v=f.k.includes('X')?Math.floor((d.cr2!=null?d.cr2:rnd())*(f.v*2+1)):f.v;if(!v){floatAt(x,'NOTHING','#c28cf0');addStress(x,3);}else healHero(x,Math.max(1,v+(qd(h,'devout')?1:0)+gear(h).heal));});sfx.heal();}
    else if(f.t==='mana'){G.mana=Math.min(12,(G.mana||0)+f.v);floatAt(h,'+'+f.v+' MANA','#7aa0ff');sparkle(h,'#7aa0ff',14);tone(880,.15,.05,'sine',1320);}
    else if(f.t==='loot'){G.gold+=f.v;floatAt(h,'+'+f.v+' GOLD','#e0b040');tone(1200,.08,.05,'square');tone(1600,.1,.04,'square',null,.06);updateHud();}
    else if(f.t==='calm'){tg.forEach(x=>{addStress(x,-(f.v+gear(h).calm));sparkle(x,'#e6dfcb',6);});sfx.calm();}
    else if(f.t==='torch'){G.torch=Math.min(100,G.torch+f.v+gear(h).torch);floatAt(h,'LIGHT','#ffb050');sparkle(h,'#ffb050',16);sfx.torch();updateHud();}
    await sleep(320);
  }
  if((f.k.includes('S')||(f.t==='dmg'&&gear(h).selfcost))&&!h.dead&&!h.dd&&h.hp>1){h.hp--;floatAt(h,'-1','#ff4a36');}
  if(f.k.includes('W'))livingH().filter(x=>x!==h).forEach(x=>addStress(x,3));
  if(f.k.includes('G')){f.v+=1;floatAt(h,'GROWS','#8cff6a');}
  if(f.k.includes('U')){const E=efOf(h),i=E.indexOf(f);if(i>=0)E[i]=F('blank',0);floatAt(h,'SPENT','#a89a80');}
  await processResolves();
  G.busy=false;
  if(!activeE().length)return victory();
  updatePanel();
}
async function enemyAct(e,it){
  const f=it.f;
  if(['dmg','str','bleed','shove','blight'].includes(f.t)){
    let tg=it.tgts.filter(x=>!x.dead);if(!tg.length){tg=pickTargets(f);it.tgts=tg;}if(!tg.length)return;
    e.tele=it;await sleep(REDUCED?120:320);e.tele=null;
    camOn(e,tg[0]);
    const ranged=['arbalist'].includes(e.key)||(f.t==='str')||(f.t==='blight')||f.tg==='back';
    if(ranged){sfx.whoosh();await proj(e,tg[0],f.t==='str'?'wisp':f.t==='blight'?'orb':'bolt',f.t==='str'?'#c28cf0':f.t==='blight'?'#8cff6a':'#d9d0b6',.24);}
    else{lunge(e,-1);await sleep(160);if(f.t==='dmg'||f.t==='bleed')tg.forEach(h=>slash(h,'#ff7a6a'));sfx.slash();}
    const bonus=eBonus();
    const cc=G.torch>=75?.03:G.torch>=50?.07:G.torch>=25?.12:.18;
    if(f.t==='dmg'){
      let v=f.v+bonus;const crit=rnd()<cc;
      if(crit){v=Math.ceil(v*1.5);sfx.crit();shake(7);buzz([50,30,80]);say('enemyCrit',2);hitstop(180);G.redFlash=.45;punch(1.4);}else{sfx.thud();shake(3);}
      tg.forEach(h=>{hurtHero(h,v,`Slain by ${e.name}`);if(crit)addStress(h,10);});
      if(crit)livingH().filter(h=>!tg.includes(h)).forEach(h=>addStress(h,3));
    }else if(f.t==='str'){tg.forEach(h=>{addStress(h,f.v+(G.torch<25?2:0));ring(h,'#c28cf0','burst');});shake(2);}
    else if(f.t==='bleed'){tg.forEach(h=>{h.bleed+=f.v+(qd(h,'flux')?1:0);floatAt(h,'BLEED','#ff5a46');hurtHero(h,1,`Rent apart by ${e.name}`);
      if(G.zone==='warrens'&&!h.dead&&rnd()<.15&&addDisease(h,'flux'))floatAt(h,'RED FLUX','#ff5a46');});sfx.bleed();}
    else if(f.t==='blight'){tg.forEach(h=>{h.blight=(h.blight||0)+f.v;floatAt(h,'BLIGHT','#8cff6a');});sfx.bleed();}
    else{tg.forEach(h=>{if(gear(h).noShove){floatAt(h,'BRACED','#9fb6c8');return;}let m=false;while(stepHero(h,1))m=true;if(m)floatAt(h,'SHOVED','#ffa040');addStress(h,4);});sfx.hit();shake(3);}
    if(f.shove)tg.forEach(h=>{if(!h.dead&&!gear(h).noShove&&stepHero(h,1))floatAt(h,'SHOVED','#ffa040');});
    await sleep(440);camReset();
    if(f.mv&&!e.dead&&stepEnemy(e,f.mv))floatAt(e,f.mv<0?'ADVANCES':'FALLS BACK','#d8ccb4');
  }else if(f.t==='heal'){
    const L=activeE().slice().sort((a,b)=>a.hp/a.max-b.hp/b.max);const t=f.tg==='self'?e:L[0];
    if(t){const b=t.hp;t.hp=Math.min(t.max,t.hp+f.v);floatAt(t,'+'+(t.hp-b),'#6ad07a');sfx.heal();}await sleep(380);
  }else if(f.t==='summon'){
    const ci=G.enemies.findIndex(x=>x.corpse&&!x.dead);
    if(livingE().length<4||ci>=0){say('summon',1,.5);const n=mkEnemy(f.sk||'thrall');if(ci>=0){n.x=G.enemies[ci].x;G.enemies[ci].dead=true;G.enemies[ci].alpha=0;G.enemies.splice(ci,0,n);}else{n.x=e.x;G.enemies.unshift(n);}n.intents=[{f:EF('blank',0,'none'),tgts:[]}];floatAt(n,'RISES','#7fd0c0');sfx.stress();
      narrate(({thrall:'Up from the black water, another of the faithful.',rabble:'The bones answer. They always answer.',fleshhound:'Something tears itself free of her.'})[f.sk||'thrall']);}
    await sleep(500);
  }else if(f.t==='toll'){
    sfx.bell();shake(4);G.torch=Math.max(0,G.torch-f.v);updateHud();await banner('The bell tolls','aff',1100);livingH().forEach(h=>addStress(h,4));
  }
}
async function enemyPhase(){
  if(G.busy||G.phase!=='act')return;
  G.busy=true;G.phase='enemy';G.sel=null;G.spell=null;G.undo=[];G.buffDmg=0;updatePanel();
  await sleep(150);if(!REDUCED)await banner('The dark acts','test',650);
  for(const e of activeE().slice()){
    if(e.dead||e.corpse)continue;
    if(e.stun){floatAt(e,'STUNNED','#f0c85a');await sleep(350);continue;}
    for(const it of e.intents){
      if(e.dead)break;if(it.f.t==='blank'||it.f.t==='blk')continue;
      await enemyAct(e,it);await ddCheck();await processResolves();
      if(!livingH().length)return defeat();
    }
  }
  for(const h of livingH()){if(h.bleed>0){hurtHero(h,h.bleed,'Bled out in the dark',true);h.bleed--;await sleep(220);}}
  for(const h of livingH()){if(h.blight>0){hurtHero(h,h.blight,'Withered by blight',true);floatAt(h,'BLIGHT','#8cff6a');await sleep(220);}}
  for(const e of livingE()){if(e.bleed>0){dmgEnemy(e,e.bleed,true);e.bleed--;await sleep(220);}}
  for(const e of livingE()){if(e.blight>0){dmgEnemy(e,e.blight,true);await sleep(200);}}
  for(const h of livingH()){
    if(h.aff==='abusive'){const o=pick(livingH().filter(x=>x!==h));if(o){floatAt(h,'SNARL','#d0574b');addStress(o,6);}}
    if(h.virtue==='courageous')livingH().forEach(x=>x!==h&&addStress(x,-3));
    if(h.virtue==='vigorous'&&!h.dd)healHero(h,1);
  }
  if(G.torch<25&&livingH().length){const v=pick(livingH());addStress(v,G.torch<=0?6:3);}
  await ddCheck();await processResolves();
  livingE().forEach(e=>{e.stun=false;if(e.marked)e.marked--;});
  if(!livingH().length)return defeat();
  if(!activeE().length)return victory();
  G.busy=false;newTurn();
}
const ddCheck=()=>Promise.resolve();

async function startCombat(keys,kind){
  G.kind=kind;G.enemies=keys.map(mkEnemy);G.enemies.forEach((e,i)=>e.x=200+i*20);
  if(hasT('censer'))G.enemies.forEach(e=>e.bleed=2);
  livingH().forEach(h=>{h.block=0;h.bleed=0;h.blight=0;h.ef=facesOf(h);});
  {const L=livingH();L.forEach((h,i)=>(h.trink||[]).forEach(k=>{const m=HT[k]&&HT[k].fx&&HT[k].fx.mod;
    if(m==='heir'&&L[i+1])h.ef[5]=cloneF(L[i+1].ef[2]);
    if(m==='swapmid'&&L[i-1]){const a=h.ef[2];h.ef[2]=L[i-1].ef[2];L[i-1].ef[2]=a;}}));}
  G.mana=0;G.spell=null;G.undo=[];G.buffDmg=0;G.fb=G.campBuff||{dmg:0,guard:0,mark:0};G.campBuff={dmg:0,guard:0,mark:0};G.firstStun=false;
  G.turn=0;G.dice=[];G.phase='intro';G.busy=true;showCombat();
  updatePanel();
  if(G.fb.mark&&activeE()[0])activeE()[0].marked=2;
  if(kind!=='boss'){
    if(kind==='ambush'||(G.torch<25&&rnd()<.35)){G.heroes=shuffle(livingH());await sleep(300);sfx.stress();say('surprised',2);await banner('Surprised!','aff',1500,'The line breaks in the dark');}
    else if(G.torch>=75&&rnd()<.3){G.firstStun=true;await sleep(300);sfx.virtue();say('ambush',2);await banner('Ambush!','virtue',1500,'You caught them unaware. They lose their first turn');}
  }
  const Z=ZONES[G.zone];
  if(kind==='boss'){await sleep(500);sfx.bell();await banner(ENEMIES[Z.boss].name,'aff',1800,Z.bossSub);narrate(Z.bossLine,3);}
  else{say(kind==='elite'?'elite':'battle',1);await sleep(700);}
  G.busy=false;newTurn();
}
async function victory(){
  G.busy=true;G.phase='won';G.sel=null;updatePanel();
  await sleep(600);
  G.enemies=[];G.dice=[];
  livingH().forEach(h=>{h.block=0;h.bleed=0;});
  G.heroes=livingH();
  sfx.win();say('victory',1);
  const xp=G.kind==='boss'?(G.zone==='upper'?1:3):G.kind==='elite'?2:1;
  livingH().forEach(h=>{if((h.lvl||1)<5)h.xp=(h.xp||0)+xp;});
  if(G.kind==='boss'&&G.zone==='bell'){await sleep(800);await levelUps();return finale();}
  if(G.kind==='boss'){await sleep(800);await banner(`${ENEMIES[ZONES[G.zone].boss].name} falls`,'virtue',2000);await levelUps();return returnHome('boss');}
  const tier=ZONES[G.zone].tier;
  let gold=ri(12,22)+G.room*3;if(G.kind==='elite')gold*=2;gold=Math.round(gold*(1+(100-G.torch)/100*.8)*(hasT('coin')?1.5:1)*[1,1.5,2,2.5][tier-1]*(livingH().some(h=>h.cls==='relic')?1.25:1)*(1+.05*tideLvl()));
  if(G.kind==='elite')deed('elites');
  G.gold+=gold;updateHud();
  await sleep(900);G.busy=false;
  await levelUps();
  rewardScreen(gold);
}
async function defeat(){
  G.phase='lost';G.busy=true;updatePanel();say('homeWipe',3);await sleep(1200);sfx.bell();
  await banner('The party is lost','aff',2000);
  G.enemies=[];G.dice=[];G.busy=false;
  returnHome('wipe');
}
async function levelUps(){
  for(const h of livingH()){while((h.lvl||1)<5&&(h.xp||0)>=XPN[h.lvl||1])await levelUpScreen(h);}
}
function levelUpScreen(h){
  return new Promise(res=>{
    h.lvl=h.lvl||1;const C=CLASSES[h.cls],evolve=h.lvl===2&&!h.title;if(!evolve)say('level',1,.5);
    const opts=h.title?[genPath(h,h.path),genPath(h,h.path)]:[genPath(h,'O'),genPath(h,'S')];setTimeout(()=>tip('level'),300);
    const art=n=>/^[AEIOU]/i.test(n)?'an':'a',lbl=(o,i)=>h.title?`${h.title} · Variant ${i?'II':'I'}`:evolve?`Become ${art(o.name)} ${o.name}`:`Lean toward the ${o.name}`;
    sfx.virtue();
    showScreen(`<h2>${h.name} reaches level ${h.lvl+1}</h2>
     <p class="tag">${h.title||C.name}. ${evolve?'Choose a new calling. This cannot be undone.':h.title?'Choose how the die is reforged.':'Choose how the die is reforged. At level 3 they take a new calling.'} Max HP +2 either way.</p>
     <div class="stack">${opts.map((o,i)=>`<button class="btn lvopt" data-o="${i}"><span class="lvn">${lbl(o,i)}</span>
       <span class="faces">${o.faces.map((f,j)=>`<img class="pxi ${o.ch.includes(j)?'chg':''}" src="${dieImg(f,C.tint).toDataURL()}" alt="${faceText(f)}">`).join('')}</span>
       <small>${o.notes.join('<br>')}</small></button>`).join('')}</div>
     <p class="tag">Gold-framed faces are the ones that change.</p>`,{stage:false,fill:true});
    $('#screen').querySelectorAll('[data-o]').forEach(b=>b.onclick=async()=>{const o=opts[+b.dataset.o];h.faces=o.faces;h.ef=null;h.lvl++;h.max+=2;h.hp+=2;sfx.win();
      if(evolve){say('evolve',3);h.title=o.name;h.path=o.type;await banner(`${h.name} becomes ${art(o.name)} ${o.name}`,'virtue',2000,`Once ${art(C.name)} ${C.name}`);}res();});
  });
}

const keyLbl=k=>G.padSeen?`<span class="k">${k}</span>`:'';
function updatePanel(){

let last=performance.now();
function frame(now){
  const rdt=Math.min(.05,(now-last)/1000);last=now;
  let dt=rdt;if(G.hitstop>0){G.hitstop-=rdt;dt=rdt*.08;}
  G.t+=dt;
  updateDice(rdt);updateUnits(dt);
  G.redFlash=Math.max(0,G.redFlash-rdt*1.6);G.whiteFlash=Math.max(0,G.whiteFlash-rdt*2.2);
  G.proj.forEach(p=>p.t+=dt);G.proj=G.proj.filter(p=>p.t<p.dur);
  G.slashes.forEach(p=>p.t+=dt);G.slashes=G.slashes.filter(p=>p.t<.22);
  G.rings.forEach(p=>p.t+=dt);G.rings=G.rings.filter(p=>p.t<.5);
  if(!$('#combat').hidden&&livingH().some(h=>h.dd)){G.ddBeat-=rdt;if(G.ddBeat<=0){G.ddBeat=1.05;sfx.heart();buzz(12);}}
  for(const p of G.fx){p.t+=dt;if(p.float){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy*=.97;continue;}p.vy+=220*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>FLOOR+3){p.y=FLOOR+3+rnd()*6;p.vx*=.3;p.vy=0;}}
  G.fx=G.fx.filter(p=>p.t<(p.float?p.life:p.life+1.5));
  G.floats.forEach(f=>f.t+=dt);G.floats=G.floats.filter(f=>f.t<1.1);
  G.tfx.forEach(p=>{p.t+=dt;p.vy+=120*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;});G.tfx=G.tfx.filter(p=>p.t<p.life);
  G.tfloats.forEach(f=>f.t+=dt);G.tfloats=G.tfloats.filter(f=>f.t<1);
  const c=G.cam,k=Math.min(1,dt*7);c.z+=(c.tz-c.z)*k;c.x+=(c.tx-c.x)*k;c.y+=(c.ty-c.y)*k;
  G.shake=Math.max(0,G.shake-dt*20);
  pollPad();drawScene();if(!$('#combat').hidden)drawTray();
  requestAnimationFrame(frame);
}

  const bk=s.querySelector('[data-back]');if(!bk||bk.textContent.trim()!=='Back')return;
  if(bk.closest('.hrow')){bk.textContent='';bk.className='xbtn';bk.setAttribute('aria-label','Close');return;}
  const x=document.createElement('button');x.className='xbtn';x.setAttribute('aria-label','Close');x.onclick=()=>bk.click();
  s.prepend(x);s.classList.add('hasx');
}
/* hold any button on a menu screen to read it in full */
function infoFor(b){
  const lines=b.innerText.split('\n').map(t=>t.trim()).filter(Boolean);
  const title=b.dataset.title||lines[0]||'';
  const body=b.dataset.info||lines.slice(1).join(' ');
  return body?{title,body}:null;
}
function showInfo(title,body){
  const pk=$('#peek');
  pk.innerHTML=`<button class="xbtn" id="pkX" aria-label="Close"></button><div class="pn">${title}</div><p class="flav">${body}</p><div class="kw">Tap outside or ✕ to close.</div>`;
  pk.hidden=false;$('#pkX').onclick=hidePeek;sfx.select();
}
function attachHold(b){
  if(b.classList.contains('xbtn'))return;
  let t=null,sx=0,sy=0;
  b.addEventListener('pointerdown',e=>{if(!$('#peek').hidden)return;sx=e.clientX;sy=e.clientY;clearTimeout(t);
    t=setTimeout(()=>{t=null;const inf=infoFor(b);if(!inf)return;swallowClick=true;buzz(15);showInfo(inf.title,inf.body);},420);});
  const cancel=()=>{clearTimeout(t);t=null;};
  b.addEventListener('pointerup',cancel);b.addEventListener('pointercancel',cancel);b.addEventListener('pointerleave',cancel);
  b.addEventListener('pointermove',e=>{if(t&&Math.hypot(e.clientX-sx,e.clientY-sy)>14)cancel();});
  b.addEventListener('contextmenu',e=>e.preventDefault());
}
function showScreen(html,opt={}){
  const s=$('#screen');s.innerHTML=html;s.hidden=false;$('#combat').hidden=true;hidePeek();
  $('#stage').hidden=opt.stage===false;s.classList.toggle('fill',!!opt.fill);s.scrollTop=0;layout();
  addCloseX(s);
  s.querySelectorAll('button').forEach(b=>{b.addEventListener('click',()=>{initAudio();sfx.ui();});attachHold(b);});
  if(G.padSeen){const f=s.querySelector('button:not(:disabled)');if(f)f.focus();}
}

   `<div class="party">${META.roster.map(d=>heroRow(d,`<button class="btn" data-gear="${d.rid}">Gear${(d.trink||[]).length?` ${(d.trink||[]).length}/2`:''}</button><button class="btn" data-dis="${d.rid}" data-info="Send them away for good. Their trinkets go back to the chest.">Dismiss</button>`)).join('')}</div>`,
   ()=>{bindPeek(META.roster);$('#screen').querySelectorAll('[data-gear]').forEach(b=>b.onclick=()=>gearScreen(b.dataset.gear,rosterScreen));
     $('#screen').querySelectorAll('[data-dis]').forEach(b=>{let armed=false;b.onclick=()=>{if(!armed){armed=true;b.textContent='Sure?';return;}const d=META.roster.find(x=>x.rid===b.dataset.dis);if(d)META.stash.push(...(d.trink||[]));META.roster=META.roster.filter(d=>d.rid!==b.dataset.dis);saveMeta();rosterScreen();};});});
}
function abbeyScreen(msg=''){
  const cost=evOn('carnival')?0:30;
  subScreen('Abbey',msg||`Prayer eases ${abbeyAmt()} stress and lifts a virtue's afterglow. ${cost} gold each.`,
   `<div class="party">${META.roster.map(d=>heroRow(d,`<button class="btn" data-pray="${d.rid}" ${d.stress>0&&META.gold>=cost?'':'disabled'}>Pray</button>`)).join('')}</div>`,
   ()=>{bindPeek(META.roster);$('#screen').querySelectorAll('[data-pray]').forEach(b=>b.onclick=()=>{const d=META.roster.find(x=>x.rid===b.dataset.pray);META.gold-=cost;d.stress=Math.max(0,d.stress-abbeyAmt());sfx.calm();saveMeta();abbeyScreen(`${d.name} kneels until the shaking stops.`);});});
}
function sanitScreen(msg=''){
  const cost=sanitCost(),sick=META.roster.filter(d=>d.aff||(d.quirks||[]).some(k=>!QUIRKS[k].g));
  subScreen('Sanitarium',msg||`Leeches, cold baths, locked rooms. ${cost} gold per cure.`,
   `<div class="party">${sick.length?sick.map(d=>heroRow(d,[d.aff?`<button class="btn" data-cure="${d.rid}|aff" ${META.gold>=cost?'':'disabled'}>${AFFS.find(a=>a.id===d.aff).name}</button>`:'',
     ...(d.quirks||[]).filter(k=>!QUIRKS[k].g).map(k=>`<button class="btn" data-cure="${d.rid}|${k}" ${META.gold>=cost?'':'disabled'}>${QUIRKS[k].n}</button>`)].join(''),true)).join('')
     :'<p class="flav">No one here needs the cold baths. For now.</p>'}</div>`,
   ()=>{bindPeek(META.roster);$('#screen').querySelectorAll('[data-cure]').forEach(b=>b.onclick=()=>{const [rid,k]=b.dataset.cure.split('|');const d=META.roster.find(x=>x.rid===rid);
     META.gold-=cost;deed('cures');if(k==='aff')d.aff=null;else removeQuirk(d,k);sfx.heal();saveMeta();sanitScreen(`${d.name} is a little more whole.`);});});
}
function smithScreen(rid,msg=''){
  const cost=smithCost();
  if(!rid){
    subScreen('Smithy',msg||`Hone one die face per hero each week for ${cost} gold, or forge weapons and armour up to tier ${gearCap()+1}.`,
     `<div class="party">${META.roster.map(d=>heroRow(d,`<button class="btn" data-sm="${d.rid}" ${d.honed===META.week?'disabled':''} data-info="Strengthen one face of this hero's die. Once per week, ${cost} gold.">${d.honed===META.week?'Done':'Hone'}</button><button class="btn" data-fg="${d.rid}" data-info="Weapon: ${WNAMES[d.wpn||0]}. Armour: ${ANAMES[d.arm||0]}. Forge better ones here.">Forge</button>`)).join('')}</div>`,
     ()=>{bindPeek(META.roster);$('#screen').querySelectorAll('[data-sm]').forEach(b=>b.onclick=()=>smithScreen(b.dataset.sm));
       $('#screen').querySelectorAll('[data-fg]').forEach(b=>b.onclick=()=>gearScreen(b.dataset.fg,()=>smithScreen(null)));});
    return;
  }
  const d=META.roster.find(x=>x.rid===rid),C=CLASSES[d.cls];
  const ok=f=>!['blank','stun','mark'].includes(f.t);
  subScreen(`Hone ${d.name}`,`Choose one face to strengthen. ${cost} gold. You have ${META.gold}.`,
   `<div class="grid2b">${d.faces.map((f,i)=>{const n=cloneF(f);n.v+=bumpAmt(f);return `<button class="btn hone" data-f="${i}" ${ok(f)&&META.gold>=cost?'':'disabled'}>
     <span class="faces"><img class="pxi" src="${dieImg(f,C.tint).toDataURL()}" alt=""> → <img class="pxi" src="${dieImg(ok(f)?n:f,C.tint).toDataURL()}" alt=""></span><small>${ok(f)?faceText(n):'Cannot be honed'}</small></button>`;}).join('')}</div>`,
   ()=>{$('#back').onclick=()=>smithScreen(null);$('#screen').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const f=d.faces[+b.dataset.f];META.gold-=cost;f.v+=bumpAmt(f);d.honed=META.week;sfx.block();saveMeta();smithScreen(null,`${d.name}'s die now shows ${faceText(f)}.`);});});
}
function buildScreen(msg=''){
  subScreen('Builders',msg||`Stone and timber, paid in gold. You have ${META.gold}.`,
   `<div class="stack">${Object.keys(B_INFO).map(k=>{const lv=META.bld[k],I=B_INFO[k],c=B_COST[lv];return `<button class="btn" data-b="${k}" ${lv<2&&META.gold>=c?'':'disabled'}>
     ${I.n} · level ${lv+1}${lv<2?` → ${lv+2} for ${c} gold`:' (complete)'}<small>Now: ${I.d[lv]}${lv<2?`<br>Next: ${I.d[lv+1]}`:''}</small></button>`;}).join('')}</div>`,
   ()=>{$('#screen').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const k=b.dataset.b,c=B_COST[META.bld[k]];META.gold-=c;META.bld[k]++;sfx.win();saveMeta();buildScreen(`The ${B_INFO[k].n} grows.`);});});
}

const RAR={c:'Common',r:'Rare',k:'Class',o:'Odd'};
const htLabel=k=>`${HT[k].n}${HT[k].cls?` (${CLASSES[HT[k].cls].name} only)`:''}`;
function randTrinket(rare){
  const pool=Object.keys(HT).filter(k=>rare?HT[k].r!=='c':HT[k].r==='c'||rnd()<.3);
  return pick(pool);
}
const GZ={dmg:0,rdmg:0,mdmg:0,heal:0,healIn:0,calm:0,bleed:0,hp:0,stress:0,crit:0,guard:0,guard1:0,selfcost:0,ferry:0,noShove:0,lightHi:0,lightLo:0,dark:0,torch:0};
function gear(h){
  const g={...GZ};if(!h)return g;
  for(const k of (h.trink||[])){const fx=HT[k]&&HT[k].fx;if(fx)for(const x in fx)g[x]+=fx[x];}
  return g;
}
const WNAMES=['Worn','Honed','Tempered','Masterwork','Hallowed'],ANAMES=['Patched','Riveted','Reinforced','Masterwork','Hallowed'];
const wDmg=h=>((h.wpn||0)>=2?1:0)+((h.wpn||0)>=4?1:0);
const wTxt=l=>`+${(l>=2?1:0)+(l>=4?1:0)} strike damage, +${l*2}% crit`;
const aTxt=l=>`+${l*2} max HP${l>=4?', +1 Guard every turn':''}`;
const GEAR_COST=[60,110,180,260];
const gearCap=()=>2+META.bld.smith;
function gearDmg(h,R){const g=gear(h);return g.dmg+(R?g.rdmg:g.mdmg)+(G.torch>=75?g.lightHi:0)+(G.torch<25?g.lightLo:0)+(G.torch<50?g.dark:0)+wDmg(h);}
function equip(d,k){d.trink=d.trink||[];if(d.trink.length>=2)return false;const hp=(HT[k].fx.hp||0);d.trink.push(k);d.max=Math.max(4,d.max+hp);d.hp=clamp(d.hp+hp,1,d.max);return true;}
function unequip(d,k){const i=(d.trink||[]).indexOf(k);if(i<0)return;d.trink.splice(i,1);const hp=(HT[k].fx.hp||0);d.max=Math.max(4,d.max-hp);d.hp=clamp(d.hp-hp,1,d.max);}
function gearScreen(rid,back,msg=''){
  const d=META.roster.find(x=>x.rid===rid);if(!d)return back();
  d.trink=d.trink||[];d.wpn=d.wpn||0;d.arm=d.arm||0;
  const gc=l=>Math.ceil(GEAR_COST[l]*(evOn('shortage')?1.5:1)),cap=gearCap(),wc=gc(d.wpn),ac=gc(d.arm);
  const elig=k=>!HT[k].cls||HT[k].cls===d.cls;
  const stash=META.stash.map((k,i)=>({k,i}));
  setTimeout(()=>tip('gear'),300);
  subScreen(`${d.name}'s Gear`,msg||`${CLASSES[d.cls].name} · HP ${d.max} · You have ${META.gold} gold.`,
   `<div class="gearlist">
     <div class="grow"><div class="gi"><b>${WNAMES[d.wpn]} weapon</b><span>${wTxt(d.wpn)}</span></div>
       <button class="btn" id="gW" ${d.wpn<4&&d.wpn<cap&&META.gold>=wc?'':'disabled'} data-info="Forge the weapon to ${WNAMES[Math.min(4,d.wpn+1)]}: ${wTxt(Math.min(4,d.wpn+1))}. Better Smithy levels allow higher tiers.">${d.wpn>=4?'Complete':d.wpn>=cap?'Smithy too small':`Forge · ${wc}`}</button></div>
     <div class="grow"><div class="gi"><b>${ANAMES[d.arm]} armour</b><span>${aTxt(d.arm)}</span></div>
       <button class="btn" id="gA" ${d.arm<4&&d.arm<cap&&META.gold>=ac?'':'disabled'} data-info="Forge the armour to ${ANAMES[Math.min(4,d.arm+1)]}: ${aTxt(Math.min(4,d.arm+1))}. Better Smithy levels allow higher tiers.">${d.arm>=4?'Complete':d.arm>=cap?'Smithy too small':`Forge · ${ac}`}</button></div>
     ${[0,1].map(i=>{const k=d.trink[i];return k?`<div class="grow eq"><div class="gi"><b>${HT[k].n}</b><span>${HT[k].d}</span></div><button class="btn" data-un="${k}">Remove</button></div>`
       :`<div class="grow empty"><div class="gi"><b>Empty trinket slot</b><span>Equip one from the reliquary chest below.</span></div></div>`;}).join('')}
   </div>
   <h3>Reliquary chest · ${META.stash.length}</h3>
   <div class="gearlist">${stash.length?stash.map(({k,i})=>`<div class="grow"><div class="gi"><b>${htLabel(k)} <span class="rar ${HT[k].r}">${RAR[HT[k].r]}</span></b><span>${HT[k].d}</span></div>
     <button class="btn" data-eq="${i}" ${elig(k)&&d.trink.length<2?'':'disabled'}>${elig(k)?'Equip':'Not for them'}</button></div>`).join(''):'<p class="flav">Empty. Trinkets are found after battles, sold by the peddler, and hoarded by the masters below.</p>'}</div>`,
   ()=>{$('#back').onclick=back;
     const W=$('#gW'),A=$('#gA');
     if(W)W.onclick=()=>{META.gold-=wc;d.wpn++;sfx.block();saveMeta();gearScreen(rid,back,`The weapon is now ${WNAMES[d.wpn]}.`);};
     if(A)A.onclick=()=>{META.gold-=ac;d.arm++;d.max+=2;d.hp+=2;sfx.block();saveMeta();gearScreen(rid,back,`The armour is now ${ANAMES[d.arm]}.`);};
     $('#screen').querySelectorAll('[data-un]').forEach(b=>b.onclick=()=>{const k=b.dataset.un;unequip(d,k);META.stash.push(k);sfx.ui();saveMeta();gearScreen(rid,back,`${HT[k].n} goes back in the chest.`);});
     $('#screen').querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{const i=+b.dataset.eq,k=META.stash[i];if(!equip(d,k))return;META.stash.splice(i,1);sfx.select();saveMeta();gearScreen(rid,back,`${d.name} takes the ${HT[k].n}.`);});
   });
}

/* ---------- embark ---------- */
const bellOpen=()=>['crypt','cellars','warrens'].every(k=>META.beaten[k]);
function zoneList(){
  if(!(META.deeds.exped>0)&&!META.ngp)return['upper'];
  return['crypt','cellars','warrens','bell'];
}
function zoneScreen(){
  subScreen('Embark','Choose where to descend. Deeper places pay better and forgive less.',
   `<div class="stack">${zoneList().map(k=>{const Z=ZONES[k];if(k==='bell'&&!bellOpen())return `<button class="door zone" disabled><span class="dt">A Sealed Stair</span><span class="dh">Something waits for three voices to fall silent.</span></button>`;
     return `<button class="door zone" data-z="${k}"><span class="dt">${Z.name}</span>
     <span class="dh">${'☠'.repeat(Z.tier)} · ${Z.rooms||ROOMS} rooms · ${ENEMIES[Z.boss].name}${META.beaten[k]?` · slain ×${META.beaten[k]}`:''}</span><span class="dh">${Z.desc}</span></button>`;}).join('')}</div>`,
   ()=>{$('#screen').querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{G.zone=b.dataset.z;chosen=[];partyScreen();});});
}
let chosen=[];
function partyScreen(){
  const R=META.roster;
  subScreen('Choose the Party',`${ZONES[G.zone].name}. Pick up to four. The first you pick stands at the front. Tap ⓘ to inspect.`,
   `<div class="grid2">${R.map((d,i)=>{const C=CLASSES[d.cls],o=chosen.indexOf(d.rid);return `<button class="card ${o>=0?'sel':''}" data-i="${d.rid}">
     <img class="pxi spr" src="${sprURL[d.cls]}" alt="">
     <span class="cb"><span class="cn">${d.name}${o>=0?` <span class="ord">· ${o+1}</span>`:''}</span><span class="cs">${d.title||C.name} L${d.lvl||1} · St ${d.stress}${d.aff?' · '+AFFS.find(a=>a.id===d.aff).name:''}</span>
     <span class="faces">${d.faces.map(f=>`<img class="pxi" src="${dieImg(f,C.tint).toDataURL()}" alt="">`).join('')}</span></span></button>`;}).join('')}</div>
   <div class="grid2b"><button class="btn primary" id="go" ${chosen.length?'':'disabled'}>Provision (${chosen.length}/4)</button><button class="btn" id="insp" ${chosen.length?'':'disabled'}>ⓘ Last picked</button></div>`,
   ()=>{$('#back').onclick=()=>zoneScreen();
     $('#screen').querySelectorAll('.card').forEach(b=>b.onclick=()=>{const id=b.dataset.i,o=chosen.indexOf(id);if(o>=0)chosen.splice(o,1);else if(chosen.length<4)chosen.push(id);partyScreen();
       const nb=document.querySelector(`.card[data-i="${id}"]`);if(nb&&G.padSeen)nb.focus();});
     $('#go').onclick=()=>provisionScreen();
     $('#insp').onclick=()=>{const d=R.find(x=>x.rid===chosen[chosen.length-1]);if(d)showPeek(mkHero(d.cls,d.name,d),null);};});
}
let prov={torch:0,bandage:0,laudanum:0,holy:0,food:0,shovel:0};
const PROV_COST={torch:10,bandage:12,laudanum:15,holy:20,food:6,shovel:15};
const provCost=k=>evOn('harvest')?Math.ceil(PROV_COST[k]/2):PROV_COST[k];
const PROV_FREE={torch:1,bandage:1,food:2};
function provisionScreen(){
  const spent=Object.keys(prov).reduce((a,k)=>a+prov[k]*provCost(k),0),left=META.gold-spent;
  subScreen('Provisions',`One torch, one bandage and two rations come free. The party eats every third room. You have ${left} gold left.${evOn('harvest')?' Half price this week.':''}`,
   `<div class="grid2b">${Object.keys(PROV_COST).map(k=>`<button class="btn" data-p="${k}" ${left>=provCost(k)?'':'disabled'} data-info="${({torch:'Raises the torch by 30.',bandage:'Heals 5 and lifts a hero from Death\'s Door.',laudanum:'Removes 25 stress.',holy:'Opens safer choices at some curios.',food:'The party eats every third room, one ration per two heroes. Without food they starve.',shovel:'Clears rubble that blocks a passage.'})[k]}"><img class="pxi" width="16" height="16" src="${IMG[k]}" alt=""> ${itemName(k)} ×${prov[k]+(PROV_FREE[k]||0)}<small>+1 for ${provCost(k)} gold</small></button>`).join('')}</div>
   <div class="grid2b"><button class="btn" id="clr">Clear</button><button class="btn primary" id="desc">Descend</button></div>`,
   ()=>{$('#back').onclick=()=>partyScreen();
     $('#screen').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{prov[b.dataset.p]++;provisionScreen();});
     $('#clr').onclick=()=>{prov={torch:0,bandage:0,laudanum:0,holy:0,food:0,shovel:0};provisionScreen();};

function continueRun(sv){

function returnHome(result){
  clearRun();
  const Z=ZONES[G.zone],lines=[];
  let gold=G.gold;
  if(result==='retreat')gold=Math.round(gold*.75);
  if(result==='wipe')gold=0;
  if(result==='boss'){const bonus=Z.bonus!=null?Z.bonus:[150,250,400,0][Z.tier-1];gold+=bonus;META.beaten[G.zone]=(META.beaten[G.zone]||0)+1;lines.push(`The boss's hoard: +${bonus} gold.`);}
  META.gold+=gold;deed('goldBank',gold);deed('exped');if(result==='boss')deed('boss_'+G.zone);
  if(result==='boss'){const k=randTrinket(true);(G.found=G.found||[]).push(k);lines.push(`In the hoard: ${htLabel(k)}.`);}
  if(result!=='wipe'&&(G.found||[]).length){META.stash.push(...G.found);lines.push(`Into the reliquary chest: ${G.found.map(k=>HT[k].n).join(', ')}.`);}
  if(result==='wipe'&&(G.found||[]).length)lines.push('The trinkets they found stay below with them.');
  for(const id of G.partyIds){const h=G.heroes.find(x=>x.rid===id);if(h&&h.dead&&(h.trink||[]).length)lines.push(`Lost with ${h.name}: ${h.trink.map(k=>HT[k].n).join(', ')}.`);}
  if(result!=='wipe')G.trinkets.forEach(k=>{if(!META.trinkets.includes(k)){META.trinkets.push(k);lines.push(`${TRINKETS[k].name} now hangs in the hamlet's reliquary for good.`);}});
  const surv=livingH(),dead=G.partyIds.filter(id=>!surv.some(h=>h.rid===id));
  META.roster=META.roster.filter(d=>!dead.includes(d.rid));
  for(const h of surv){
    h.hp=h.max;h.dd=false;h.virtue=null;h.bleed=0;h.block=0;
    if(result==='retreat')h.stress=Math.min(200,h.stress+15);
    if(rnd()<.5){const q=addQuirk(h,rnd()<.6);if(q)lines.push(`${h.name} came back ${QUIRKS[q].g?'changed for the better':'marked'}: ${QUIRKS[q].n}.`);}
    const i=META.roster.findIndex(d=>d.rid===h.rid);if(i>=0)META.roster[i]=heroData(h);
    else if(META.roster.length<rosterCap()){META.roster.push(heroData(h));lines.push(`${h.name} comes home with you and joins the roster.`);}else{META.pool.push({...heroData(h),keep:true});lines.push(`${h.name} waits at the stagecoach; the barracks are full.`);}
  }
  for(const d of META.roster)if(!G.partyIds.includes(d.rid))d.stress=Math.max(0,d.stress-20);
  const rec=loadRec();rec.runs++;if(result==='boss')rec.wins++;rec.best=Math.max(rec.best||0,G.room+1);saveRec(rec);
  if(G.zone==='upper')queueLetter('three');
  if(result==='boss'&&['crypt','cellars','warrens'].includes(G.zone)){const n=['crypt','cellars','warrens'].filter(k=>META.beaten[k]).length;queueLetter(['','one','two','all'][n]);}
  const fresh=checkUnlocks();fresh.forEach(c=>lines.push(`<em>A new calling: the ${CLASSES[c].name}.</em> One rides in on the next coach.`));
  const carry=META.pool.filter(d=>d.keep);
  META.week++;rollEvent();META.pool=newPool().concat(carry);
  if(tideLvl()>=3)queueLetter('tide1');if(tideLvl()>=6)queueLetter('tide2');
  saveMeta();
  G.loc='hamlet';G.enemies=[];G.dice=[];G.busy=false;G.phase='end';
  say(result==='boss'?'homeBoss':result==='retreat'?'homeRetreat':'homeWipe',3);
  const head={boss:'The Expedition Triumphs',retreat:'A Retreat in Good Order',wipe:'No One Comes Back'}[result];
  const flav={boss:`${surv.map(h=>`<em>${h.name}</em>`).join(', ')} climb out of ${Z.name} with the boss's blood still drying.`,
    retreat:`They turn back from ${Z.name}. Pride is lighter than a corpse. They keep three quarters of the gold.`,
    wipe:`${Z.name} keeps every one of them. The gold stays below with the bodies.`}[result];
  showScreen(`<h2>${head}</h2><p class="flav">${flav}</p>
   <p class="result flav">+${gold} gold to the hamlet.${dead.length?` Lost: ${dead.length}.`:''}<br>${lines.join('<br>')||'Nothing else worth writing down.'}</p>
   <button class="btn primary" id="home">To the hamlet</button>`,{stage:false});
  $('#home').onclick=goHamlet;
  updateHud();
}

const ROOMINFO={

function genDoors(){
  const Z=ZONES[G.zone],N=roomsN();
  if(Z.script)return Z.script[G.room].map(t=>({type:t,known:true}));
  if(G.room===N-1)return[{type:'boss',known:true}];
  const n=rnd()<.45?3:2,out=[];
  const w=[['battle',45],['curio',26],['camp',G.room>=3?10:3],['elite',G.room>=3?12:0],['trader',G.room>=2?8:0]];
  for(let i=0;i<n;i++){let tot=w.reduce((a,b)=>a+b[1],0),r=rnd()*tot,ty='battle';for(const [k,v] of w){r-=v;if(r<=0){ty=k;break;}}out.push({type:ty});}
  if(G.room===N-2&&!out.some(d=>d.type==='camp'))out[out.length-1].type='camp';
  out.forEach(d=>{d.known=G.scout||G.torch>=50?true:G.torch>=25?rnd()<.5:false;
    if(d.type!=='boss'){d.blocked=rnd()<.14;d.trap=rnd()<(.12+(G.torch<50?.08:0));d.trapSeen=d.trap&&(G.scout||(G.torch>=75&&rnd()<.7));}});
  G.scout=false;
  return out;
}

  showScreen(`<div class="hrow"><h2>${ZONES[G.zone].name}</h2><button class="btn sm" id="useTorch" ${G.inv.torch&&G.torch<100?'':'disabled'}>Torch +30</button></div>
   <div class="hrow"><div class="track" aria-label="Room ${G.room+1} of ${N}">${track}</div><span class="tag">Room ${G.room+1}/${N} · ${lightName()}</span></div>
   <div class="party">${L.map((h,i)=>`<div class="prow">
     <img class="pxi" src="${sprURL[h.cls]}" alt="" data-ph="${i}">
     <div class="info" data-ph="${i}"><div class="n">${i+1}. ${h.name} <span class="lv">L${h.lvl||1}</span></div><div class="s">HP ${h.hp}/${h.max} · Stress ${h.stress}
       ${h.dd?'<span class="chip dd">Door</span>':''}${h.aff?`<span class="chip aff">${AFFS.find(a=>a.id===h.aff).name}</span>`:''}${h.virtue?`<span class="chip vir">${VIRTUES.find(a=>a.id===h.virtue).name}</span>`:''}</div></div>
     <div class="ctl">
       <button class="btn" data-up="${i}" ${i===0?'disabled':''} aria-label="Move ${h.name} forward">▲</button>
       <button class="btn" data-dn="${i}" ${i===L.length-1?'disabled':''} aria-label="Move ${h.name} back">▼</button>
       <button class="btn" data-band="${i}" ${G.inv.bandage&&(h.hp<h.max||h.dd)?'':'disabled'} aria-label="Bandage ${h.name}" title="Bandage: +5 HP"><img class="pxi" src="${IMG.bandage}" alt=""></button>
       <button class="btn" data-laud="${i}" ${G.inv.laudanum&&h.stress>0?'':'disabled'} aria-label="Laudanum for ${h.name}" title="Laudanum: −25 stress"><img class="pxi" src="${IMG.laudanum}" alt=""></button>
     </div></div>`).join('')}</div>
   <div class="doors">${G.doors.map((d,i)=>{const R=ROOMINFO[d.type];return d.known?
     `<button class="door" data-door="${i}" data-info="${R.h} ${R.l}${d.blocked?' Rubble blocks the way: clear it with a shovel, or dig by hand.':''}${d.trapSeen?' The torch shows a trap in the passage; you will step around it.':''}"><span class="dt">${R.t}${d.blocked?' <span class="chip aff">Rubble</span>':''}${d.trapSeen?' <span class="chip aff">Trap</span>':''}</span><span class="dh">${R.h}</span></button>`:
     `<button class="door unknown" data-door="${i}" data-info="The torch cannot reach this far. It could be a fight, a curio, a camp, a peddler or something worse. Light a torch to see further."><span class="dt">Unlit</span><span class="dh">The torch cannot reach.</span></button>`;}).join('')}</div>
   <button class="btn sm" id="retreat" data-info="Turn back now. You keep three quarters of the gold found so far, every hero gains 15 stress, and the week ends.">Retreat (keep ¾ of ${G.gold} gold)</button>`,{fill:true});
  const s=$('#screen');
  s.querySelectorAll('[data-ph]').forEach(el=>el.onclick=()=>showPeek(livingH()[+el.dataset.ph],null));
  s.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;swapH(i,i-1);});

  s.querySelectorAll('[data-door]').forEach(b=>b.onclick=()=>enterRoom(+b.dataset.door));
  let armed=false;$('#retreat').onclick=()=>{if(!armed){armed=true;$('#retreat').innerHTML='Tap again to turn back';return;}returnHome('retreat');};
}
function swapH(a,b){const L=livingH();if(b<0||b>=L.length)return;[L[a],L[b]]=[L[b],L[a]];G.heroes=L;corridor();
  const btn=document.querySelector(`[data-${b<a?'up':'dn'}="${b}"]`)||document.querySelector('[data-door]');if(btn&&G.padSeen)btn.focus();}
function enterRoom(i){
  const d=G.doors[i];G.doors=null;
  G.torch=Math.max(0,G.torch-(hasT('tallow')?6:10));updateHud();
  for(const h of livingH())if(qd(h,'rot')&&h.hp>1){h.hp--;floatAt(h,'ROT','#9a8a60');}

function encounter(kind){

function enterRoomType(type){

function roomDone(){G.room++;G.doors=null;corridor();}

function passage(d,go){
  if(d.blocked){
    say('rubble',1);const canDig=G.inv.shovel>0;
    showScreen(`<h2>Rubble</h2><p class="flav">Fallen stone and old timber choke the passage. Something on the other side is breathing.</p>
     <div class="stack">
      <button class="btn" id="pShovel" ${canDig?'':'disabled'}>Clear it with a shovel<small>Uses 1 shovel (${G.inv.shovel||0} left)</small></button>
      <button class="btn" id="pHand">Dig by hand<small>Torch −15 and every hero gains 6 stress</small></button>
     </div>`);
    $('#pShovel').onclick=()=>{G.inv.shovel--;updateHud();sfx.toss();d.blocked=false;passage(d,go);};
    $('#pHand').onclick=()=>{G.torch=Math.max(0,G.torch-15);partyStress(6);updateHud();sfx.toss();d.blocked=false;passage(d,go);};
    return;
  }
  const lines=[];
  if(G.room>0&&G.room%3===0){
    const need=Math.ceil(livingH().length/2);
    if((G.inv.food||0)>=need){G.inv.food-=need;lines.push(`The party eats in silence. (${need} ration${need>1?'s':''} eaten, ${G.inv.food} left)`);}
    else{say('starve',2);G.inv.food=0;livingH().forEach(h=>{if(!h.dd)h.hp=Math.max(1,h.hp-3);addStress(h,12);});lines.push('<em>Starving.</em> There is not enough food. Every hero loses 3 HP and gains 12 stress.');}
  }
  if(d.trap){
    if(d.trapSeen){say('trapSeen',1);partyStress(-3);lines.push('The torchlight catches a wire across the floor. You step over it, and feel a little better for it.');}
    else{say('trap',2);const kind=pick(['spikes','gas','pit']),L=livingH();
      if(kind==='spikes'){const h=L[0];if(!h.dd)h.hp=Math.max(1,h.hp-4);addStress(h,6);lines.push(`<em>A trap!</em> Spikes punch up through the floor under ${h.name}. −4 HP.`);}
      else if(kind==='gas'){L.forEach(h=>addStress(h,8));lines.push('<em>A trap!</em> A pipe in the wall hisses out a yellow mist. Every hero gains 8 stress.');}
      else{const h=pick(L);if(!h.dd)h.hp=Math.max(1,h.hp-3);addStress(h,10);lines.push(`<em>A trap!</em> The floor gives way under ${h.name}. −3 HP, +10 stress.`);}
      sfx.hit();shake(4);}
  }
  updateHud();
  if(!lines.length)return go();
  setTimeout(()=>tip('passage'),300);
  showScreen(`<h2>The Passage</h2>${lines.map(l=>`<p class="result flav">${l}</p>`).join('')}<button class="btn primary" id="pGo">Go on</button>`);
  $('#pGo').onclick=async()=>{$('#pGo').disabled=true;await processResolves();if(!livingH().length)return defeat();go();};
}

   </div>
   <div class="grid2b">
    <button class="btn" id="sleep" data-info="Every hero heals half their HP, and the camp ends. ${C.watch?'Someone keeps watch, so nothing will come.':'Something may find you while you sleep.'}">Sleep<small>Heal half · ends camp</small></button>
    <button class="btn primary" id="leave">Break camp</button>

/* ================= STORY ================= */
const LETTERS={
 intro:{t:'A Letter, Sealed in Black Wax',b:`You came. I did not think anyone would.

I rang the bell of Hollowmere for forty-one years. I rang it for weddings and for drownings, and at the end I rang it for no reason at all, because the rope would not stop pulling at my hands.

The bell is gone now. I still hear it. So, I think, will you.

Begin with the upper stairs beneath the chapel. There are only bones there, and bones are honest. Learn how the dark moves before you go deeper.`},
 three:{t:'The Three Wounds',b:`You came back. Good. Sit, and I will tell you what lies under us.

Three places have opened beneath Hollowmere. The Sunken Crypt, where a bishop still sings to drowned men. The Bone Cellars, where something wears a crown of knuckles and counts. The Flesh Warrens, where the walls have learned to breathe.

Close them, one by one. Each will fight harder the longer we wait. The tide is rising, and it does not rise for water alone.`},
 one:{t:'One Voice Silent',b:`One of them is quiet. I slept last night, the first time since spring.

Do not grow proud. The others heard it die, and they will be waiting.`},
 two:{t:'Two Voices Silent',b:`Two are quiet now. The children have begun to play in the square again, though their mothers call them in before dusk.

I found the old founder's ledger in the chapel loft. I have been reading it. I wish I had not. If you find any of his pages below, bring them to me.`},
 all:{t:'Beneath Them All',b:`All three are silent, and still I hear it.

I understand now. They were never three wounds. They were three roots of one thing. The bell was not lost. It was buried, on purpose, by the man who cast it, and it has been ringing under our feet this whole time.

Beneath the hamlet there is a stair no one has used in a hundred years. I have unbarred it. I am sorry.`},
 tide1:{t:'The Tide Rises',b:`The well has gone salt. The fishermen say the sea stands higher than in their fathers' time, and the sea is a mile from here.

Whatever is below grows bolder each week we do not go down to meet it.`},
 tide2:{t:'The Tide Rises Again',b:`Water stands in the chapel nave this morning, ankle-deep, and it is warm.

Hurry. I am not sure how many more weeks this hamlet has.`},
 second:{t:'The Second Bell',b:`You broke it. I heard it break.

And then, three nights later, I heard it again. Fainter. Further down. Ivo Thatch did not cast one bell. He cast two.

I am sorry to ask this of you twice. The dark below will be harder this time. It remembers you.`},
 end:{t:'The Last Letter',b:`It is quiet.

I went down to the shore this morning. The tide was out, further than I have ever seen it, and the sand was only sand.

I do not know what you lost to do this. I know the names in your ledger, and I will ring once for each of them, on a small handbell, which is the only bell I will ever touch again.

Hollowmere will forget you. That is what it means that you won.`},
};
const PAGES=[
 'Ivo Thatch, founder of bells, his account. The council of Hollowmere has asked for a bell loud enough to call the tide away from the lower fields. I told them no bell can do that. They paid me anyway.',
 'The bishop came to my foundry with a cart of old bronze from the drowned chapel. He says metal that has lain in salt water remembers the sea, and will know how to speak to it.',
 'The first casting cracked. The bishop said the bell needed something of the town in it. The next morning he brought me a box of teeth. I did not ask whose.',
 'The second casting held. When it cooled it rang once on its own, though no one touched it. Everyone in the foundry felt it in their teeth. One of my apprentices did not stop shaking for a week.',
 'We hung it in the tower. The tide drew back a full mile that first evening. There was dancing in the square. I did not dance.',
 'The tide is gone, but the fishermen say the fish are gone with it. And at night the bell rings, very softly, with the tower doors locked.',
 'The bishop preaches that the bell is a voice, and that it is asking for things. Half the town believes him. The other half is afraid to say otherwise.',
 'Three men walked into the sea last night, singing. The bishop says they were called. I say they were murdered by a thing I made.',
 'Tonight we cut the bell down and bury it under the chapel, as deep as we can dig. I have cast a smaller bell to hang above it, tuned to hold it silent. God help me if I tuned it wrong.',
 'If anyone finds this: the bell is not evil. It is hungry, and it was made to call. Do not answer it. If you must go down to it, break it from the inside, where the bronze is thinnest.',
];

 stress:{t:'Stress',b:'The white pips under a hero are stress. At 100 their resolve is tested, and most break. Steady faces, laudanum, the abbey and good fortune remove it.'},
 dd:{t:"Death's Door",b:'At 0 HP a hero stands at Death\'s Door. Any further hit may kill them for good. Any healing pulls them back.'},
 test:{t:'Resolve',b:'At 100 stress a hero is tested. Most become afflicted and work against the party. A rare few become virtuous and grow stronger.'},
 corridor:{t:'Choosing a passage',b:'Each room costs torchlight. Choose a door, reorder the line, and use bandages and laudanum here. In darkness you see less of what lies ahead, but foes drop more gold. Hold any button to read it in full.'},
 hamlet:{t:'Hollowmere',b:'Spend gold between expeditions. Hire at the stagecoach, ease stress at the abbey, cure the sick at the sanitarium and hone dice at the smithy. The tide rises every week, so do not wait too long.'},
 level:{t:'Level up',b:'Choose one of two reforged dice. Gold-framed faces are the ones that change. One path hits harder; the other keeps the party alive.'},

 mana:{t:'Mana and spells',b:'Mana faces fill the party\'s pool, shown in the dice tray. Every calling in your party brings one spell. Tap a spell to cast it when you have the mana. Mana lasts until the fight ends.'},
